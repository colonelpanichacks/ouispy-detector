[env:seeed_xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; ESP-NOW itself at the long-range PHY rate (250 kbps LR). Every node has
    ; the LR protocol enabled, so all of them decode both LR and 1 Mbps.
    -DMESH_ESPNOW_LR_RATE=WIFI_PHY_RATE_LORA_250K

; Upload options
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.0

; Board configuration
board_build.arduino.memory_type = qio_opi
; 8 MB flash, two 3.2 MB app slots for firmware updates over the mesh
; (mesh_ota.cpp). NVS stays at 0x9000 / 20 KB, so settings and the fleet key
; survive the switch from the old single-slot huge_app.csv layout; LittleFS
; moves, so its session files start over once.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Dedicated Sky-Spy drone node: the same mesh firmware (fleet key, OTA,
; dashboard) with Remote ID always on and no filters. pio run -e skyspy
[env:skyspy]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DSKYSPY_NODE

; WiGLE-style wardriver: every access point and BLE device, printed as WD lines for the
; Tab5 (GPS stamping, map, WiGLE CSV). Still a mesh node. See src/wardrive.h.
[env:wardrive]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DWARDRIVE_NODE
