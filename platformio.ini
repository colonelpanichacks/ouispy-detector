[env:seeed_xiao_esp32s3]
platform = espressif32@^6.13.0
board = seeed_xiao_esp32s3
framework = arduino

; Pin Arduino core to v3.3.x (ESP-IDF v5.5.5) for esp_wifi_set_promiscuous_buf_num
; and esp_bt_dev_set_bt_mac support — these are not available in IDF 4.4 (Arduino 2.x).
platform_packages =
    framework-arduinoespressif32-esp32s3-libs @ 3.3.12

; Build options
build_flags = 
    -MMD -c
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Upload options
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.0

; Board configuration
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio 