; OUI-SPY Mesh wall dashboard for the M5Stack Tab5 (ESP32-P4 + ESP32-C6 Wi-Fi) with the
; Tab5 Keyboard. Reads the home dashboard's HTTP + Socket.IO API over Wi-Fi.
;
; First flash over USB-C:   pio run -e tab5 -t upload --upload-port /dev/cu.usbmodemXXXX
; Every flash after that:   TAB5_OTA_PASS=... pio run -e tab5-ota -t upload --upload-port <tab5 address>
;
; Nothing secret lives here: Wi-Fi, dashboard address, access token and the OTA password
; are typed on the device (Settings, key S) or over serial, and kept in NVS.

[platformio]
default_envs = tab5

[env]
; Official pioarduino release (arduino-esp32
; 3.3.8, IDF 5.5). Its m5stack-tab5-p4 board carries the C6 SDIO pins; the partition table
; is pinned to default_16MB.csv: two OTA slots (app0 + app1, 6.25 MB each).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"1.0.0\"
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
    ; arduino-esp32 3.3.8's m5stack_tab5 variant leaves this out but esp32-hal-spi.c needs it
    ; (same LDO channel as the generic P4 variant).
    -DBOARD_SDMMC_POWER_CHANNEL=4
lib_ldf_mode = deep
lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5GFX@^0.2.17
    m5stack/M5UnitUnified@^0.4.6
    https://github.com/m5stack/M5Unit-KEYBOARD.git
    bblanchon/ArduinoJson@^7.4.2
    links2004/WebSockets@^2.7.1

[env:tab5]

[env:tab5-ota]
upload_protocol = espota
upload_flags =
    --port=3232
    --auth=${sysenv.TAB5_OTA_PASS}
